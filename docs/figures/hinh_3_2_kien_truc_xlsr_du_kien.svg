<text x="227.0" y="22.5" font-size="11" font-weight="bold" text-anchor="middle" dominant-baseline="central">Dạng sóng 16 kHz, 4 giây (64.000 mẫu)</text>
<text x="227.0" y="35.5" font-size="10" text-anchor="middle" dominant-baseline="central">sau chính sách biên độ peak và cắt đoạn</text>
<text x="227.0" y="76.5" font-size="11" font-weight="bold" text-anchor="middle" dominant-baseline="central">Chuẩn hóa từng đoạn</text>
<text x="227.0" y="89.5" font-size="10" text-anchor="middle" dominant-baseline="central">(x − μ) / √(σ² + 10⁻⁷)</text>
<text x="227" y="134" font-size="11" font-weight="bold" text-anchor="middle" dominant-baseline="central">XLS-R 300M (trọng số tiền huấn luyện)</text>
<text x="227.0" y="160.5" font-size="11" font-weight="bold" text-anchor="middle" dominant-baseline="central">Bộ mã hóa đặc trưng CNN</text>
<text x="227.0" y="173.5" font-size="10" text-anchor="middle" dominant-baseline="central">đóng băng ở cả X0 và X1</text>
<text x="227.0" y="212.5" font-size="11" font-weight="bold" text-anchor="middle" dominant-baseline="central">Tầng Transformer 1 … 24 − k</text>
<text x="227.0" y="225.5" font-size="10" text-anchor="middle" dominant-baseline="central">đóng băng (chiều ẩn 1.024)</text>
<text x="227.0" y="262.5" font-size="11" font-weight="bold" text-anchor="middle" dominant-baseline="central">k tầng Transformer cuối</text>
<text x="227.0" y="275.5" font-size="10" text-anchor="middle" dominant-baseline="central">X0: k = 0; X1: k ∈ {2, 4, 8}, được cập nhật</text>
<text x="235" y="309" font-size="9.5" font-style="italic" text-anchor="start" dominant-baseline="central">chuỗi khung, mỗi khung 1.024 chiều</text>
<text x="227.0" y="332.5" font-size="11" font-weight="bold" text-anchor="middle" dominant-baseline="central">Gộp trung bình và độ lệch chuẩn</text>
<text x="227.0" y="345.5" font-size="10" text-anchor="middle" dominant-baseline="central">theo thời gian → vectơ 2.048 chiều</text>
<text x="227.0" y="387.0" font-size="11" font-weight="bold" text-anchor="middle" dominant-baseline="central">Bộ phân loại</text>
<text x="227.0" y="400.0" font-size="10" text-anchor="middle" dominant-baseline="central">Linear(2.048 → 128) → ReLU → Dropout 0,2</text>
<text x="227.0" y="413.0" font-size="10" text-anchor="middle" dominant-baseline="central">→ Linear(128 → 1)</text>
<text x="227.0" y="454.5" font-size="11" font-weight="bold" text-anchor="middle" dominant-baseline="central">Một logit cho mỗi đoạn</text>
<text x="227.0" y="467.5" font-size="10" text-anchor="middle" dominant-baseline="central">điểm cao hơn = bằng chứng giả mạo mạnh hơn</text>
<text x="38" y="500" font-size="9.5" text-anchor="start" dominant-baseline="central">Không cập nhật khi huấn luyện</text>
<text x="228" y="500" font-size="9.5" text-anchor="start" dominant-baseline="central">Tham số được huấn luyện</text>
<text x="10" y="516" font-size="9" font-style="italic" text-anchor="start" dominant-baseline="central">Learning rate: bộ mã hóa 10⁻⁵ hoặc 3·10⁻⁵, bộ phân loại 10⁻³; batch 16 (chốt ngày 03/11/2026).</text>
