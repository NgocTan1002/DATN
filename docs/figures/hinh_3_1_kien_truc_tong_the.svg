<text x="18" y="30.0" font-size="10.5" font-weight="bold" text-anchor="start" dominant-baseline="central">1. Dữ liệu</text>
<text x="112" y="24.0" font-size="10" text-anchor="start" dominant-baseline="central">metadata → split theo người nói (seed 2026)</text>
<text x="112" y="38.0" font-size="10" text-anchor="start" dominant-baseline="central">→ manifest khử trùng → Parquet hoặc packed</text>
<text x="18" y="84.0" font-size="10.5" font-weight="bold" text-anchor="start" dominant-baseline="central">2. Tiền xử lý</text>
<text x="112" y="78.0" font-size="10" text-anchor="start" dominant-baseline="central">resample 16 kHz → chính sách biên độ peak</text>
<text x="112" y="92.0" font-size="10" text-anchor="start" dominant-baseline="central">→ đoạn cố định 4 giây (64.000 mẫu)</text>
<text x="18" y="138.0" font-size="10.5" font-weight="bold" text-anchor="start" dominant-baseline="central">3. Mô hình</text>
<text x="112" y="132.0" font-size="10" text-anchor="start" dominant-baseline="central">B0: LFCC 60 × 401 → LCNN</text>
<text x="112" y="146.0" font-size="10" text-anchor="start" dominant-baseline="central">X0, X1: XLS-R 300M → pooling → MLP</text>
<text x="18" y="192.0" font-size="10.5" font-weight="bold" text-anchor="start" dominant-baseline="central">4. Huấn luyện</text>
<text x="112" y="186.0" font-size="10" text-anchor="start" dominant-baseline="central">sampler tiếp tục được, controller epoch và</text>
<text x="112" y="200.0" font-size="10" text-anchor="start" dominant-baseline="central">early stopping, kho checkpoint theo generation</text>
<text x="18" y="246.0" font-size="10.5" font-weight="bold" text-anchor="start" dominant-baseline="central">5. Đánh giá</text>
<text x="112" y="240.0" font-size="10" text-anchor="start" dominant-baseline="central">EER, ROC-AUC, macro-F1, ngưỡng tại EER dev,</text>
<text x="112" y="254.0" font-size="10" text-anchor="start" dominant-baseline="central">khoảng tin cậy bootstrap theo người nói</text>
<text x="18" y="300.0" font-size="10.5" font-weight="bold" text-anchor="start" dominant-baseline="central">7. Đăng ký</text>
<text x="112" y="294.0" font-size="10" text-anchor="start" dominant-baseline="central">sổ đăng ký mô hình, cổng đánh giá cuối</text>
<text x="112" y="308.0" font-size="10" text-anchor="start" dominant-baseline="central">khóa một lần (đã thử trên dev-full)</text>
<text x="18" y="354.0" font-size="10.5" font-weight="bold" text-anchor="start" dominant-baseline="central">8. Minh họa</text>
<text x="112" y="348.0" font-size="10" text-anchor="start" dominant-baseline="central">suy luận cửa sổ trượt 4 giây, bước nhảy 2 giây</text>
<text x="112" y="362.0" font-size="10" text-anchor="start" dominant-baseline="central">và chương trình minh họa</text>
<text x="403.0" y="77.5" font-size="10.5" font-weight="bold" text-anchor="middle" dominant-baseline="central">6. Vận hành</text>
<text x="403.0" y="102.5" font-size="9.5" text-anchor="middle" dominant-baseline="central">script CLI</text>
<text x="403.0" y="115.0" font-size="9.5" text-anchor="middle" dominant-baseline="central">cục bộ</text>
<text x="403.0" y="140.0" font-size="9.5" text-anchor="middle" dominant-baseline="central">đóng gói mã</text>
<text x="403.0" y="152.5" font-size="9.5" text-anchor="middle" dominant-baseline="central">nguồn có</text>
<text x="403.0" y="165.0" font-size="9.5" text-anchor="middle" dominant-baseline="central">SHA-256</text>
<text x="403.0" y="190.0" font-size="9.5" text-anchor="middle" dominant-baseline="central">phiên GPU</text>
<text x="403.0" y="202.5" font-size="9.5" text-anchor="middle" dominant-baseline="central">Kaggle</text>
<text x="403.0" y="227.5" font-size="9.5" text-anchor="middle" dominant-baseline="central">chuyển</text>
<text x="403.0" y="240.0" font-size="9.5" text-anchor="middle" dominant-baseline="central">checkpoint</text>
<text x="403.0" y="252.5" font-size="9.5" text-anchor="middle" dominant-baseline="central">giữa các phiên</text>
<text x="38" y="392.0" font-size="9.5" text-anchor="start" dominant-baseline="central">Đã triển khai</text>
<text x="178" y="392.0" font-size="9.5" text-anchor="start" dominant-baseline="central">Chưa triển khai</text>
<text x="324" y="392.0" font-size="9.5" text-anchor="start" dominant-baseline="central">Hạ tầng dùng chung</text>
